[project]
name = "bank-ai-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant POC: LangGraph multi-agent, hybrid RAG, recursive research agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langsmith>=0.14",
    "pinecone>=10,<11",
    "mcp>=2.3,<3",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.10",
    "pyyaml>=6",
    "aiosqlite>=0.21",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50"]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "retrieval*", "security*", "tools*", "rlm*", "graph*", "api*", "mcp_server*", "ui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
